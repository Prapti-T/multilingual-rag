# `docker compose up -d qdrant`        -> Qdrant only (use QDRANT_URL=http://localhost:6333 from the host)
# `docker compose up --build`          -> Qdrant + API container
# Not built or run as part of the repo's test suite; treat it as a starting point.
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  api:
    build: .
    profiles: ["api"]            # start with: docker compose --profile api up --build
    environment:
      QDRANT_URL: http://qdrant:6333
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    volumes:
      - ./data/index:/app/data/index   # sparse-encoder metadata written by `mlrag ingest`
      - hf_cache:/root/.cache/huggingface

volumes:
  qdrant_storage:
  hf_cache:
